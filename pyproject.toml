[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-market"
version = "0.1.0"
description = "Rule-based chart reads, BTC watcher and paper-trade replay, for study only"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vision = ["anthropic"]
guard = ["laya"]

[project.scripts]
laya-market = "laya_market.cli:main"

[tool.setuptools]
packages = ["laya_market"]

[tool.setuptools.package-data]
laya_market = ["prompts/*.md"]
